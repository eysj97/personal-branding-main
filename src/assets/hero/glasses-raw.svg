<!--
  The glasses as they were handed over: a machine trace, every point on a whole
  pixel and 1-2px apart, so every curve in it is really a staircase.

  Nothing imports this. It is kept because glasses.svg beside it was derived
  from it and may need deriving again — at a different smoothing strength, or
  split up differently for some other animation. Redrawing from this is honest;
  re-smoothing the already-smoothed one is not.

  How glasses.svg was made from this:
    1. Ramer-Douglas-Peucker at a tolerance of 1.0, per ring, starting from the
       sharpest corner so the arbitrary start point does not become a kink.
       Cuts about 64% of the points and takes the staircase with them.
    2. Catmull-Rom through what is left, emitted as cubic Beziers.
    3. Split into parts that can move: the two lens rings became both a white
       fill and a clip, the frame was redrawn over the top, and the traced
       pupils were replaced with ellipses on the lens centres.

  Measured against this file, the result strays at most 1.64px on a drawing
  768 wide — 0.21%, which is inside this trace own integer-coordinate noise.
-->
