<!-- Outline only: the lenses are holes, not shapes. `fill="none"` is on
     the path as well as the root, because the root's is inherited and an
     inherited value is one an <img> load, a filter, or anything that
     re-serialises this file can drop — and the moment it does, a closed
     path fills itself black and the glasses come back with dark lenses. -->
<svg width="512.91" height="498.00" viewBox="0 0 512.91 498.00" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The glasses, as the line drawing the design now uses (Figma 1306:1469 /
     1306:1493, where the frame and the eyes are one white stroke).

     Drawn in hero-eyes' 512.91 x 498 box rather than its own 461 x 185, because
     the two files are laid over each other at the same size and a viewBox that
     did not match would have to be squashed to fit. The group below is what
     puts it there: scaled and shifted so the design's pupils land exactly on
     the ones hero-eyes already has, which is the one feature both drawings
     agree on the meaning of. Everything else follows from that.

     Black, and not filtered to it. It was a bitmap painted #0492bd and turned
     white at every point of use; a stroke can simply be the colour it is. The
     career section wanted it black anyway, so its filter there is now doing
     nothing and has been dropped — and the mask it also uses this for is
     unaffected either way, since a mask reads alpha and the alpha of a stroked
     path is the frame and nothing else. -->
