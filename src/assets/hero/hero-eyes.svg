<svg width="512.91" height="498.00" viewBox="0 0 512.91 498.00" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- What shows through the lenses, over glasses.svg. Same box, same placement.

     The two eye states are the design's own (1306:1493 shut, 1306:1469 open),
     with their coordinates baked into this box rather than wrapped in a scaling
     group: the gaze moves [data-pupil] by GAZE_TRAVEL in *these* units (see
     Hero), and inside a scaled group those numbers would quietly mean something
     3.5% smaller. -->
<!-- Registered on the open eye, not on the design's own placement.

     The two states are cross-faded in place, so wherever their middles disagree
     the eye slides across the lens as it opens. They disagreed badly: the shut
     pair is drawn 234.46 apart and the open pupils are 192 apart, so the left
     eye jumped 37 units outward and both dropped 11 as they opened, and only
     the right one happened to land near where it started.

     Each curve is therefore translated so the middle of its bounding box sits
     on its own pupil's centre — (161, 236) and (353, 236). Shape, width and cap
     are the design's, untouched; only the placement moved, and it moved to the
     one place that makes the handover invisible. -->
<g data-eye="closed">
  <path d="M134.71,230.90 C140.99,242.00 175.24,245.37 187.30,234.28" stroke="#1D1C1C" stroke-width="9.648" stroke-linecap="round"/>
  <path d="M326.71,230.90 C332.98,242.00 367.23,245.37 379.29,234.28" stroke="#1D1C1C" stroke-width="9.648" stroke-linecap="round"/>
</g>
<!-- Open: a white eye with a dark pupil in it, not a plain white dot.

     A dot was what this was, and at the size the character actually spends most
     of its life — 60px in the corner of a phone, where the whole eye is about
     two px — a white dot and the white lash-line of the shut state are the same
     mark: two small pale smudges. There was nothing in the drawing that said
     which. The pupil is what says it. It costs one circle and it is the one
     feature that cannot be mistaken for a closed lid.

     Solid, with no pupil in it. A pupil was tried and taken out again: what
     the two states have to be is *unlike*, and a filled disc against the shut
     state's thin arc already is — one is a mass, the other a line, and that
     reads at any size. A ring inside the disc only adds detail that is gone by
     the time the character is 60px across.

     Dark, under white glasses (glasses.svg). ABOUT paints the glasses back to
     black on its yellow circle; see the note there for why that is a filter
     rather than a second drawing. -->
<g data-eye="open">
  <g data-pupil="left"><circle cx="161" cy="236" r="19.779" fill="#1D1C1C"/></g>
  <g data-pupil="right"><circle cx="353" cy="236" r="19.779" fill="#1D1C1C"/></g>
</g>
<!-- The lens tint over a shut eye. It is the frame's path filled instead of
     stroked — that path is the lens centre line, so filling it is the lens
     interior by construction and cannot drift out of register with the rim the
     way a separately drawn shape could. (It was a separate shape, and the new
     frame is not the same drawing as the old one.)

     The frame's path less its first subpath, and that omission is the whole
     point. glasses.svg draws three subpaths in one `d`: the bridge, then the
     two lens loops. The bridge is an arc — an *open* subpath, which is fine
     while it is only ever stroked. Fill the same `d` and the renderer closes it
     with a straight line back to its start, and the sliver between the arc and
     that line fills solid: a black crescent sitting exactly over the nose
     bridge, in the middle of the glasses, on every surface this tint is used.
     Painting it black on a yellow circle is where it was impossible to miss.

     So only the two closed loops are here. They are copied rather than derived
     because there is nothing to derive from at load time — this is a static
     file. If the frame's drawing changes, this `d` has to be re-copied from it
     minus that first subpath; there is no third place for the two to disagree,
     since the rim and the tint are the only readers of the shape. -->

<!-- The design has no tint at all. It is kept because two things still need it:
     the shut eye is a thin white curve that wants a darker lens behind it, and
     the career section's handoff glasses is built by stripping this file down to
     this one group — see LENS_ONLY there. -->
<g data-lens="closed">
  <g transform="translate(27.8543 153.0251) scale(0.964824)">
    <path d="M261.872 64.2928C261.234 92.3528 277.171 147.331 307.388 163.33C324.218 174.376 385.416 190.983 417.546 158.377C441.567 134 453.5 100.864 453.5 66.9635C453.248 56.1058 453.388 44.604 447.763 34.5823C440.495 21.6353 403.394 9.82254 371.264 9.82254C331.103 9.82254 310.448 15.5362 292.089 24.6787C277.401 31.9927 263.912 53.1196 261.872 64.2928ZM202.968 64.2928C200.036 95.1464 186.138 153.807 150.567 166.758C141.769 170.569 75.5857 191.65 43.0866 155.715C24.6931 135.378 8.2199 112.316 7.51495 68.4871C7.21386 49.7679 11.5292 39.1903 14.0172 34.9671C17.4596 24.3034 56.4738 11.7295 69.4785 9.82254C92.428 6.45926 139.245 4.26126 165.866 21.6307C192.488 39.0002 200.163 58.7061 202.968 64.2928Z" fill="black" fill-opacity="0.5"/>
  </g>
</g>
</svg>
