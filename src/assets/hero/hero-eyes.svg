<svg width="512.91" height="498.00" viewBox="0 0 512.91 498.00" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- What shows through the lenses, over glasses.svg. Same box, same placement.

     The two eye states are the design's own (1306:1493 shut, 1306:1469 open),
     with their coordinates baked into this box rather than wrapped in a scaling
     group: the gaze moves [data-pupil] by GAZE_TRAVEL in *these* units (see
     Hero), and inside a scaled group those numbers would quietly mean something
     3.5% smaller. -->
<g data-eye="closed">
  <path d="M97.80,242.27 C104.08,253.37 138.33,256.74 150.39,245.65" stroke="#FFFFFF" stroke-width="9.648" stroke-linecap="round"/>
  <path d="M332.26,242.27 C338.53,253.37 372.78,256.74 384.84,245.65" stroke="#FFFFFF" stroke-width="9.648" stroke-linecap="round"/>
</g>
<g data-eye="open">
  <g data-pupil="left"><circle cx="161" cy="236" r="19.779" fill="#FFFFFF"/></g>
  <g data-pupil="right"><circle cx="353" cy="236" r="19.779" fill="#FFFFFF"/></g>
</g>
<!-- The lens tint over a shut eye. It is the frame's own path, filled instead of
     stroked — that path is the lens centre line, so filling it is the lens
     interior by construction and cannot drift out of register with the rim the
     way a separately drawn shape could. (It was a separate shape, and the new
     frame is not the same drawing as the old one.)

     The design has no tint at all. It is kept because two things still need it:
     the shut eye is a thin white curve that wants a darker lens behind it, and
     the career section's handoff glasses is built by stripping this file down to
     this one group — see LENS_ONLY there. -->
<g data-lens="closed">
  <g transform="translate(27.8543 153.0251) scale(0.964824)">
    <path d="M261.872 64.2928C254.349 55.9128 228.365 47.5328 202.968 64.2928M261.872 64.2928C261.234 92.3528 277.171 147.331 307.388 163.33C324.218 174.376 385.416 190.983 417.546 158.377C441.567 134 453.5 100.864 453.5 66.9635C453.248 56.1058 453.388 44.604 447.763 34.5823C440.495 21.6353 403.394 9.82254 371.264 9.82254C331.103 9.82254 310.448 15.5362 292.089 24.6787C277.401 31.9927 263.912 53.1196 261.872 64.2928ZM202.968 64.2928C200.036 95.1464 186.138 153.807 150.567 166.758C141.769 170.569 75.5857 191.65 43.0866 155.715C24.6931 135.378 8.2199 112.316 7.51495 68.4871C7.21386 49.7679 11.5292 39.1903 14.0172 34.9671C17.4596 24.3034 56.4738 11.7295 69.4785 9.82254C92.428 6.45926 139.245 4.26126 165.866 21.6307C192.488 39.0002 200.163 58.7061 202.968 64.2928Z" fill="black" fill-opacity="0.5"/>
  </g>
</g>
</svg>
