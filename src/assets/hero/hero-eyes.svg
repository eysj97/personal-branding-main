  <!-- The lenses, over the eye. Two of them, because the tint is part of the
       eye state and not a fixed property of the glasses: black at 50% while the
       eye is shut, 10% while it is half open, and gone once it is open. The
       lens lightens as the eye comes up.
       They ride the same cross-fade as the eyes above, so each one is tied to
       its own state rather than being faded out as one piece. -->
