<svg width="170" height="203" viewBox="0 0 170 203" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- The burst over the "3" in Produce 3 solution.

     Black, not the section's yellow. The numeral it bursts off is pink now, and
     a yellow burst over a pink "3" on blue is three chromatic colours fighting
     in one glyph — black is the one thing here that reads as ink rather than as
     a fourth colour, and it is already the type's own.

     Five marks, each 12 long and 4 thick with round ends — the design's own
     (node 1306:1403, where every one of them is a 16x4 line whose stroke runs
     x=2 to x=14). They were about 6 long at width 5 before, which is why the
     cluster read as five dots rather than as a burst.

     Kept in this 170x203 box and in the same places, so the mark still lands
     where the section already puts it: the design's group sits at 399/-3 inside
     a Produce block at 372/442 on the panel, and this box is drawn at 734/326 —
     which puts these five within a pixel or two of where the design has them.

     <path> and not <line>: the draw animation measures getTotalLength() and
     walks a dash along it, and it only ever queries paths.

     Every one of them is written from its inner end outwards. That animation
     uncovers a path from its start, so the direction the `d` is written in is
     the direction the mark grows — and these five radiate from a point at about
     (84, 159), which is where the "3" they belong to sits. Written the other way
     round they grew inwards, which reads as five strokes converging on the
     numeral rather than bursting off it.

     No `data-relay`. They are all much the same distance from that point, so
     there is no inner-to-outer order to play: it is one burst, and relaying it
     would make it five separate marks being placed. -->
<g id="solution-sparkle">
<path id="Vector" d="M83.91 118V106" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
<path id="Vector_2" d="M64.73 125.39L58.73 115" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
<path id="Vector_3" d="M109.27 125.39L115.27 115" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
<path id="Vector_4" d="M49.12 141.86L38.73 135.86" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
<path id="Vector_5" d="M124.87 141.86L135.27 135.86" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
